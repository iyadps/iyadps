name: Build Alpha Collect 1.2 Test APK

on:
  push:
    branches:
      - alpha-collect-1.2-dev
    paths:
      - ".github/workflows/build-alpha-collect-1-2.yml"
      - "alpha-collect/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Alpha build files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Clone pinned KoboCollect source
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/kobotoolbox/collect.git kobo-collect
          cd kobo-collect
          git checkout b8682768b4592f7105a7b7b278328726db4a282b
          chmod +x gradlew

      - name: Apply Alpha 1.2 field-control customization
        shell: bash
        run: |
          python3 alpha-collect/apply_alpha_1_2_map.py kobo-collect

      - name: Run map, master-frame, GPS and background-audio regression tests
        working-directory: kobo-collect
        shell: bash
        run: |
          ./gradlew :collect_app:testDebugUnitTest \
            --tests "org.odk.collect.android.alpha.AlphaCsvParserTest" \
            --tests "org.odk.collect.android.alpha.AlphaFieldRulesTest" \
            --tests "org.odk.collect.android.alpha.AlphaMapTest" \
            --tests "org.odk.collect.android.audio.AudioRecordingControllerFragmentTest" \
            --stacktrace --no-daemon

      - name: Build signed Alpha Collect 1.2 test APK
        working-directory: kobo-collect
        shell: bash
        run: |
          ./gradlew :collect_app:assembleSelfSignedRelease --stacktrace --no-daemon

      - name: Verify signed test package
        shell: bash
        run: |
          mkdir -p dist
          APK="$(find kobo-collect/collect_app/build/outputs/apk -type f -name '*.apk' | grep -i 'selfsignedrelease' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "Signed Alpha Collect 1.2 test APK not found"
            find kobo-collect/collect_app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi

          cp "$APK" dist/Alpha-Collect-1.2.0-test2.apk

          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging dist/Alpha-Collect-1.2.0-test2.apk)"
          echo "$BADGING" | head -n 10
          echo "$BADGING" | grep -q "package: name='com.alphainternational.collect.test'"
          echo "$BADGING" | grep -q "versionCode='4154'"
          echo "$BADGING" | grep -q "versionName='1.2.0-test2'"
          echo "$BADGING" | grep -q "application-label:'Alpha Collect Test'"

          PERMISSIONS="$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump permissions dist/Alpha-Collect-1.2.0-test2.apk)"
          echo "$PERMISSIONS" | grep -q "android.permission.RECORD_AUDIO"
          echo "$PERMISSIONS" | grep -q "android.permission.ACCESS_FINE_LOCATION"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Alpha-Collect-1.2.0-test2.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 dist/Alpha-Collect-1.2.0-test2.apk
          (cd dist && sha256sum Alpha-Collect-1.2.0-test2.apk > Alpha-Collect-1.2.0-test2.sha256)
          cp alpha-collect/v1_2_map/TESTING.md alpha-collect/v1_2_map/sample* dist/
          printf 'Source commit: %s\nPinned Kobo: b8682768b4592f7105a7b7b278328726db4a282b\n' "$GITHUB_SHA" > dist/BUILD.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Alpha-Collect-1.2.0-test2.apk > dist/SIGNATURE.txt
          echo "$BADGING" > dist/APK-METADATA.txt
          echo "$PERMISSIONS" > dist/PERMISSIONS.txt

      - name: Upload ready-to-test Alpha Collect 1.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Alpha-Collect-1.2.0-test2-Ready
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload automated test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Alpha-map-test-results
          path: kobo-collect/collect_app/build/test-results/
          retention-days: 14
