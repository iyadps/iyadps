name: Build Alpha Collect 1.3 Secure Login Test APK

on:
  push:
    branches:
      - alpha-collect-1.3-secure-login
    paths:
      - "alpha-collect/**"
      - ".github/workflows/build-alpha-collect-1-3-secure-login.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      # Set repository variable ALPHA_COLLECT_PUBLIC_URL to the deployed
      # Alpha HTTPS gateway origin. The .invalid fallback is for UI builds only.
      ALPHA_COLLECT_PUBLIC_URL: ${{ vars.ALPHA_COLLECT_PUBLIC_URL || 'https://alpha.invalid' }}
    steps:
      - name: Checkout Alpha 1.3 branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Clone pinned KoboCollect source
        run: |
          git clone --filter=blob:none https://github.com/kobotoolbox/collect.git kobo-collect
          git -C kobo-collect checkout b8682768b4592f7105a7b7b278328726db4a282b
          chmod +x kobo-collect/gradlew
      - name: Apply Alpha 1.3 secure-login upgrade
        run: python3 alpha-collect/apply_alpha_1_3_secure_login.py kobo-collect
      - name: Test legacy Alpha 1.2.1 behavior
        working-directory: kobo-collect
        run: |
          ./gradlew :collect_app:testDebugUnitTest \
            --tests "org.odk.collect.android.alpha.AlphaCsvParserTest" \
            --tests "org.odk.collect.android.alpha.AlphaFieldRulesTest" \
            --tests "org.odk.collect.android.alpha.AlphaMapTest" \
            --tests "org.odk.collect.android.audio.AudioRecordingControllerFragmentTest" \
            --stacktrace --no-daemon
      - name: Build self-signed Alpha 1.3 test APK
        working-directory: kobo-collect
        run: ./gradlew :collect_app:assembleSelfSignedRelease --stacktrace --no-daemon
      - name: Inspect signed APK
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find kobo-collect/collect_app/build/outputs/apk -type f -name '*.apk' | grep -i selfsignedrelease | head -n1)"
          test -n "$APK"
          cp "$APK" dist/Alpha-Collect-1.3.0-secure-login-test.apk
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging dist/Alpha-Collect-1.3.0-secure-login-test.apk)"
          echo "$BADGING" | grep -q "package: name='com.alphainternational.collect.test'"
          echo "$BADGING" | grep -q "versionCode='4156'"
          echo "$BADGING" | grep -q "versionName='1.3.0-test1'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Alpha-Collect-1.3.0-secure-login-test.apk > dist/SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 dist/Alpha-Collect-1.3.0-secure-login-test.apk
          (cd dist && sha256sum Alpha-Collect-1.3.0-secure-login-test.apk > SHA256SUMS.txt)
          printf 'Source commit: %s\nAlpha server: %s\nPinned Kobo: b8682768b4592f7105a7b7b278328726db4a282b\n' "$GITHUB_SHA" "$ALPHA_COLLECT_PUBLIC_URL" > dist/BUILD.txt
          if [[ "$ALPHA_COLLECT_PUBLIC_URL" == *".invalid" ]]; then
            echo 'UI TEST BUILD ONLY: No operational Alpha backend configured' > dist/DEPLOYMENT_WARNING.txt
          fi
      - name: Upload APK package
        uses: actions/upload-artifact@v4
        with:
          name: Alpha-Collect-1.3.0-Secure-Login-Test
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Alpha-1.3-Android-Test-Reports
          path: kobo-collect/collect_app/build/test-results/
          retention-days: 14
