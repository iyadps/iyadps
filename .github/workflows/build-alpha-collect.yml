name: Build Alpha Collect Production Unsigned APK

on:
  push:
    branches:
      - alpha-collect-build
    paths:
      - ".github/workflows/build-alpha-collect.yml"
      - "alpha-collect/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Alpha build files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Clone pinned KoboCollect source
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/kobotoolbox/collect.git kobo-collect
          cd kobo-collect
          git checkout b8682768b4592f7105a7b7b278328726db4a282b
          chmod +x gradlew

      - name: Apply Alpha production customization
        shell: bash
        run: |
          python3 alpha-collect/apply_alpha_production.py kobo-collect

      - name: Run focused background-audio tests
        working-directory: kobo-collect
        shell: bash
        run: |
          ./gradlew :collect_app:testDebugUnitTest --tests "org.odk.collect.android.audio.AudioRecordingControllerFragmentTest" --stacktrace --no-daemon

      - name: Build unsigned Alpha Collect production APK
        working-directory: kobo-collect
        shell: bash
        run: |
          ./gradlew :collect_app:assembleRelease --stacktrace --no-daemon

      - name: Verify package and version, then prepare checksum
        shell: bash
        run: |
          mkdir -p dist
          APK="$(find kobo-collect/collect_app/build/outputs/apk/release -type f -name '*release-unsigned.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "Unsigned production release APK not found"
            find kobo-collect/collect_app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi
          cp "$APK" dist/Alpha-Collect-Production-Unsigned.apk

          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging dist/Alpha-Collect-Production-Unsigned.apk)"
          echo "$BADGING" | head -n 8
          echo "$BADGING" | grep -q "package: name='com.alphainternational.collect'"
          echo "$BADGING" | grep -q "versionCode='4151'"
          echo "$BADGING" | grep -q "versionName='1.0.0'"
          echo "$BADGING" | grep -q "application-label:'Alpha Collect'"

          sha256sum dist/Alpha-Collect-Production-Unsigned.apk > dist/Alpha-Collect-Production-Unsigned.sha256
          ls -lh dist

      - name: Upload unsigned production APK
        uses: actions/upload-artifact@v4
        with:
          name: Alpha-Collect-Production-Unsigned
          path: |
            dist/Alpha-Collect-Production-Unsigned.apk
            dist/Alpha-Collect-Production-Unsigned.sha256
          if-no-files-found: error
          retention-days: 7
